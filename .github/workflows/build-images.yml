name: Build images

permissions: read-all

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:
    inputs:
      tag_name:
        description: 'Release tag name'
        required: false
        type: string
        default: ''

jobs:
  main:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # required for keyless signing via GitHub OIDC
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Login to ghcr.io
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        if: ${{ github.event_name != 'pull_request' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up ko
        uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10

      - name: Build and push release image with ko
        id: ko_build_release
        if: ${{ inputs.tag_name != '' && github.event_name != 'pull_request' }}
        env:
          VERSION: ${{ inputs.tag_name }}
          REVISION: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.head_commit.timestamp }}
          KO_DOCKER_REPO: ghcr.io/bakito/kubexporter
          KO_TAGS: latest,${{ inputs.tag_name }}
          KO_PLATFORM_SPECIFIERS: linux/amd64
        run: |
          ko build --bare --sbom=none ./

      - name: Sign release image
        if: ${{ inputs.tag_name != '' && github.event_name != 'pull_request' }}
        run: |
          cosign sign --yes ghcr.io/bakito/kubexporter:${{ inputs.tag_name }}
          cosign sign --yes ghcr.io/bakito/kubexporter:latest

      - name: Build and push main image with ko
        id: ko_build_main
        if: ${{ inputs.tag_name == '' && github.event_name != 'pull_request' }}
        env:
          VERSION: main
          REVISION: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.head_commit.timestamp }}
          KO_DOCKER_REPO: ghcr.io/bakito/kubexporter
          KO_TAGS: main
          KO_PLATFORM_SPECIFIERS: linux/amd64
        run: |
          ko build --bare --sbom=none ./

      - name: Sign main image
        if: ${{ inputs.tag_name == '' && github.event_name != 'pull_request' }}
        run: |
          cosign sign --yes ghcr.io/bakito/kubexporter:main

      - name: Build image for PR (no push)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          VERSION: pr-${{ github.event.pull_request.number }}
          REVISION: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.pull_request.updated_at }}
          KO_DATA_PATH: /tmp/ko-data
        run: |
          mkdir -p $KO_DATA_PATH
          ko build --bare --push=false --sbom=none ./
