name: Headlamp Plugin Tests

on:
  push:
    branches: [main]
    paths:
      - 'plugins/headlamp/**'
      - '.github/workflows/headlamp-plugin.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'plugins/headlamp/**'
      - '.github/workflows/headlamp-plugin.yaml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugins/headlamp/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: plugins/headlamp

      - name: Run unit tests
        run: npm test
        working-directory: plugins/headlamp
