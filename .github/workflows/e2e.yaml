name: e2e tests

permissions: read-all

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-e2e-image:
    runs-on: ubuntu-latest
    outputs:
      image: kubexporter:e2e

    steps:
      - name: 🛎 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up ko
        uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10

      - name: 🖼 Build image with ko
        env:
          VERSION: e2e-tests
          REVISION: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.head_commit.timestamp }}
          KO_DATA_PATH: /tmp/ko-data
          KO_DOCKER_REPO: kubexporter
        run: |
          mkdir -p $KO_DATA_PATH
          ko build --bare --push=false --tarball=/tmp/image.tar --sbom=none --tags=e2e ./

      - name: 📦 Upload image tar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-tar
          path: /tmp/image.tar
          retention-days: 1
  e2e:
    runs-on: ubuntu-latest
    needs: build-e2e-image
    strategy:
      fail-fast: false
      matrix:
        # https://hub.docker.com/r/kindest/node/tags
        k8s_version: ["v1.35.8", "v1.36.4", "v1.37.0"]

    steps:
      - name: 🛎 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: 🔧 Install jq
        uses: dcarbone/install-jq-action@4fcb5062d7ce9bc4382d1a352d19ba3ba2c317c1 # v4.0.1

      - name: 📥 Download image tar
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v6.0.1
        with:
          name: image-tar
          path: /tmp

      - name: 🖼️ Load and tag docker image
        run: |
          docker load -i /tmp/image.tar
          docker tag kubexporter:e2e ghcr.io/bakito/kubexporter:latest

      - name: 📦 Extract binary from docker image
        run: |
          docker create --name kubexporter-container kubexporter:e2e
          docker cp kubexporter-container:/ko-app/kubexporter ./kubexporter-bin
          docker rm kubexporter-container
          chmod +x ./kubexporter-bin

      - name: 🔐 Install age
        run: sudo apt-get update && sudo apt-get install -y age

      - name: ☸ Install kind with registry
        uses: bakito/kind-with-registry-action@b13dc5fd599a5c774e7ca721d6e7a34f7269d2d8 # v1.0.1
        with:
          node_image: kindest/node:${{ matrix.k8s_version }}
          kubectl_version: ${{ matrix.k8s_version }}
          docker_image_name: kubexporter:e2e
          docker_image_file: /tmp/image.tar

      - name: 📡 Start otel collector
        run: |
          echo "Preparing otel output dir"
          mkdir -p /tmp/otel-output
          echo "Starting otel/opentelemetry-collector-contrib as a background container"
          docker run --rm -d \
            --name otel-collector \
            -p 4317:4317 \
            -v "${{ github.workspace }}/testdata/e2e/otel-collector-config.yaml":/etc/otelcol-contrib/config.yaml:ro \
            -v /tmp/otel-output:/etc/otel/output \
            -u $(id -u) \
            otel/opentelemetry-collector-contrib:latest
          # wait for the container to be up (timeout ~30s)
          for i in {1..30}; do
            docker ps --filter "name=otel-collector" --filter "status=running" | grep otel-collector && break
            sleep 1
          done
          docker ps --filter "name=otel-collector" --filter "status=running" || (docker logs otel-collector && exit 1)

      - name: 🏗 Set up test namespaces
        run: |
          kubectl apply -f testdata/e2e/namespaces.yaml
          echo "Waiting for test deployments to be created"
          for ns in e2e-ns1 e2e-ns2 e2e-ns3; do
            kubectl rollout status deployment/e2e-deploy -n "$ns" --timeout=60s
          done

      - name: 🌐 Export all namespaces
        run: |
          echo "## Export all namespaces" >> $GITHUB_STEP_SUMMARY
          ./kubexporter-bin --config config.yaml --progress simple --target exports-all --otlp-metrics=true >> $GITHUB_STEP_SUMMARY
          testdata/e2e/verify-namespaces.sh exports-all e2e-ns1 e2e-ns2 e2e-ns3

      - name: 1️⃣ Export a single namespace
        run: |
          echo "## Export a single namespace" >> $GITHUB_STEP_SUMMARY
          ./kubexporter-bin --config config.yaml --progress simple --target exports-single --namespace e2e-ns1 --otlp-metrics=false >> $GITHUB_STEP_SUMMARY
          testdata/e2e/verify-namespaces.sh exports-single e2e-ns1

      - name: 2️⃣ Export two namespaces
        run: |
          echo "## Export two namespaces" >> $GITHUB_STEP_SUMMARY
          ./kubexporter-bin --config config.yaml --progress simple --target exports-two --namespace e2e-ns1 --namespace e2e-ns2 --otlp-metrics=false >> $GITHUB_STEP_SUMMARY
          testdata/e2e/verify-namespaces.sh exports-two e2e-ns1 e2e-ns2

      - name: 🚀 Run Exporter as k8s Job
        id: run_as_k8s_job
        continue-on-error: true
        run: |
          kubectl create ns e2e
          kubectl apply -n e2e -f testdata/e2e/job-with-rbac.yaml
          echo "Waiting for Job to be terminated"
          kubectl wait --for=condition=complete job/kubexporter -n e2e --timeout=30s
      - name: 📜 Print k8s logs
        run: |
          echo "## Run Exporter as k8s Job" >> $GITHUB_STEP_SUMMARY
          kubectl logs -n e2e -l e2e=kubexporter --tail=10000 >> $GITHUB_STEP_SUMMARY

      - name: 🧐 Fail if 'Run Exporter as k8s Job' failed
        if: steps.run_as_k8s_job.outcome=='failure'
        run: |
          echo "Step 'Run Exporter as k8s Job' failed: Check the logs as well as the job summary for errors"
          exit 1
      - name: 📊 Verify metrics were pushed
        run: |
          test -s /tmp/otel-output/metrics.json || (echo "No metrics received" && exit 1)
          echo "## Metrics" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat /tmp/otel-output/metrics.json | jq >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          testdata/e2e/verify-metrics.sh /tmp/otel-output/metrics.json

      - name: 🔑 Test AES encryption roundtrip
        env:
          KUBEXPORTER_BIN: ./kubexporter-bin
        run: |
          testdata/e2e/test-aes-encryption.sh
          echo "## AES Encryption Test" >> $GITHUB_STEP_SUMMARY
          echo "✓ AES encryption and decryption roundtrip passed" >> $GITHUB_STEP_SUMMARY

      - name: 🔑 Test AES encryption with K8s secret
        env:
          KUBEXPORTER_BIN: ./kubexporter-bin
        run: |
          testdata/e2e/test-aes-encryption-k8s-secret.sh
          echo "## AES Encryption with K8s Secret Test" >> $GITHUB_STEP_SUMMARY
          echo "✓ AES encryption with K8s secret key resolution passed" >> $GITHUB_STEP_SUMMARY

      - name: 🔐 Test age encryption roundtrip
        env:
          KUBEXPORTER_BIN: ./kubexporter-bin
        run: |
          testdata/e2e/test-age-encryption.sh
          echo "## Age Encryption Test" >> $GITHUB_STEP_SUMMARY
          echo "✓ Age encryption and decryption roundtrip passed" >> $GITHUB_STEP_SUMMARY

      - name: 🔐 Test age encryption with K8s secret
        env:
          KUBEXPORTER_BIN: ./kubexporter-bin
        run: |
          testdata/e2e/test-age-encryption-k8s-secret.sh
          echo "## Age Encryption with K8s Secret Test" >> $GITHUB_STEP_SUMMARY
          echo "✓ Age encryption with K8s secret key resolution passed" >> $GITHUB_STEP_SUMMARY

      - name: 🔑 Test AES encryption during export
        env:
          KUBEXPORTER_BIN: ./kubexporter-bin
        run: |
          testdata/e2e/test-aes-encryption-during-export.sh
          echo "## AES Encryption During Export Test" >> $GITHUB_STEP_SUMMARY
          echo "✓ AES encryption during export passed" >> $GITHUB_STEP_SUMMARY

      - name: 🔐 Test age encryption during export
        env:
          KUBEXPORTER_BIN: ./kubexporter-bin
        run: |
          testdata/e2e/test-age-encryption-during-export.sh
          echo "## Age Encryption During Export Test" >> $GITHUB_STEP_SUMMARY
          echo "✓ Age encryption during export passed" >> $GITHUB_STEP_SUMMARY

      - name: 🔐 Test age identity file path
        env:
          KUBEXPORTER_BIN: ./kubexporter-bin
        run: |
          testdata/e2e/test-age-identity-file.sh
          echo "## Age Identity File Path Test" >> $GITHUB_STEP_SUMMARY
          echo "✓ Age identity file path decryption passed" >> $GITHUB_STEP_SUMMARY
