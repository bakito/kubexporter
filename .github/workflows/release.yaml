name: Create Release
permissions:
  contents: read
  attestations: write

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'headlamp-plugin-v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    # only kubexporter semver releases (vX.Y.Z), not headlamp plugin releases (headlamp-plugin-vX.Y.Z)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Release
        run: make release-ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}

      - name: Update new version in krew-index
        uses: rajatjindal/krew-release-bot@c970b8a8f6dbc2f2285a26e3ae160903b87002c3 # v0.0.51
        with:
          krew_template_file: dist/krew/exporter.yaml
          krew_plugin_release_tag: ${{ github.ref_name }}

      - name: Generate build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        with:
          subject-checksums: ./dist/checksums.txt

      - name: Upload provenance to release
        run: |
          cp ${STEPS_PROVENANCE_OUTPUTS_BUNDLE_PATH} multiple.intoto.jsonl
          gh release upload ${GITHUB_REF_NAME} multiple.intoto.jsonl --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEPS_PROVENANCE_OUTPUTS_BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}

  publish-images:
    needs: release
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: $/.github/workflows/build-images.yml
    with:
      tag_name: ${{ github.ref_name }}
    secrets: inherit

  scan-virustotal:
    needs: release
    permissions:
      contents: write
    uses: $/.github/workflows/virustotal.yaml
    with:
      release_tag: ${{ github.ref_name }}
    secrets: inherit

  release-headlamp-plugin:
    if: startsWith(github.ref, 'refs/tags/headlamp-plugin-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout kubexporter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate plugin release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^headlamp-plugin-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid Headlamp plugin release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Build Headlamp plugin
        run: |
          version="${GITHUB_REF_NAME#headlamp-plugin-v}"
          make build-headlamp-plugin HEADLAMP_PLUGIN_VERSION="$version"

      - name: Create GitHub release and upload plugin archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#headlamp-plugin-v}"
          archive="plugins/headlamp/kubexporter-headlamp-plugin-${version}.tar.gz"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$archive" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$archive" \
              --title "$GITHUB_REF_NAME" \
              --notes "Headlamp plugin release ${version}." \
              --verify-tag \
              --latest=false
          fi

      - name: Checkout Headlamp plugin catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bakito/headlamp-plugins
          token: ${{ secrets.HEADLAMP_PLUGINS_TOKEN }}
          path: headlamp-plugins
          persist-credentials: false

      - name: Publish package metadata to Artifact Hub catalog
        env:
          VERSION: ${{ github.ref_name }}
          HEADLAMP_PLUGINS_TOKEN: ${{ secrets.HEADLAMP_PLUGINS_TOKEN }}
        run: |
          version="${VERSION#headlamp-plugin-v}"
          destination="headlamp-plugins/kubexporter/${version}"
          mkdir -p "$destination"
          cp plugins/headlamp/artifacthub-pkg.yml "$destination/artifacthub-pkg.yml"
          cp plugins/headlamp/README.md "$destination/README.md"
          git -C headlamp-plugins config user.name "github-actions[bot]"
          git -C headlamp-plugins config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C headlamp-plugins add "kubexporter/${version}/artifacthub-pkg.yml" "kubexporter/${version}/README.md"
          if ! git -C headlamp-plugins diff --cached --quiet; then
            git -C headlamp-plugins commit -m "Publish kubexporter Headlamp plugin ${version}"
            git -C headlamp-plugins push "https://x-access-token:${HEADLAMP_PLUGINS_TOKEN}@github.com/bakito/headlamp-plugins.git" HEAD
          fi
