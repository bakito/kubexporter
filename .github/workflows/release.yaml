name: Create Release
permissions:
  contents: read
  attestations: write

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Release
        run: make release-ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}

      - name: Update new version in krew-index
        uses: rajatjindal/krew-release-bot@c970b8a8f6dbc2f2285a26e3ae160903b87002c3 # v0.0.51
        with:
          krew_template_file: dist/krew/exporter.yaml
          krew_plugin_release_tag: ${{ github.ref_name }}

      - name: Generate build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        with:
          subject-checksums: ./dist/checksums.txt

      - name: Upload provenance to release
        run: |
          cp ${STEPS_PROVENANCE_OUTPUTS_BUNDLE_PATH} multiple.intoto.jsonl
          gh release upload ${GITHUB_REF_NAME} multiple.intoto.jsonl --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEPS_PROVENANCE_OUTPUTS_BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}

  publish-images:
    needs: release
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/build-images.yml
    with:
      tag_name: ${{ github.ref_name }}
    secrets: inherit

  scan-virustotal:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/virustotal.yaml
    secrets: inherit
