# Default base image used by ko
defaultBaseImage: gcr.io/distroless/static:nonroot@sha256:e2e927ec666bae08560abb3c55d0659eceabb657f56b6782ab500a9fc7f555e3

# Build configuration
builds:
  - id: kubexporter
    dir: .
    main: .
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/bakito/kubexporter/version.Version={{.Env.VERSION}} -X github.com/bakito/kubexporter/version.Revision={{.Env.REVISION}} -X github.com/bakito/kubexporter/version.BuildDate={{.Env.BUILD_DATE}}
